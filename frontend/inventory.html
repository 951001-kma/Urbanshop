<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Inventario • Urbanshop</title>
  <link rel="stylesheet" href="src/css/styles-proyect.css"/>
</head>

<body>
  <!-- Topbar con sesión -->
  <header class="topbar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <h2>📦 Inventario - Urbanshop</h2>
    <div id="session-info" class="session-info" style="font-size:14px; color:#374151;">
      <!-- Se completa por JavaScript -->
    </div>
  </header>

  <div class="container">
    <aside>
      <h2>🧭 Menú</h2>
    <nav>
        <a href="dashboard.html" class="menu-item" data-required-role="admin,supervisor,vendedor,usuario">📊 Dashboard</a>
        <a href="inventory.html" class="menu-item" data-required-role="admin,supervisor,vendedor">📦 Inventario</a>
        <a href="users.html" class="menu-item" data-required-role="admin">👥 Usuarios</a>
        <a href="reports.html" class="menu-item" data-required-role="admin,supervisor">📈 Reportes</a>
        <button id="logoutBtn" class="btn-logout">⏻ Cerrar sesión</button>
    </nav>
      <div class="helper">Sistema Urbanshop</div>
    </aside>

    <div class="main-content">
      <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <strong style="font-size:1.5rem;">Gestión de Inventario</strong>
        <div class="toolbar">
          <button id="refreshBtn" class="primary">🔄 Actualizar</button>
        </div>
      </header>

      <main class="main">
        <!-- Barra de herramientas -->
        <div class="toolbar" style="margin-bottom:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <input id="inv-search" class="search" placeholder="Buscar por nombre, categoría o SKU..." style="flex:1; min-width:300px;"/>
          <button id="btn-new-product" class="primary">➕ Agregar Producto</button>
          <button id="export-inventory" class="ghost">📊 Exportar CSV</button>
          <button id="btn-low-stock" class="ghost" style="background:#fef3c7;">⚠️ Ver Bajo Stock</button>
        </div>

        <!-- Tabla de productos -->
        <div class="card">
          <div class="table-wrap">
            <table style="width:100%;">
              <thead>
                <tr style="background:#f8fafc;">
                  <th style="padding:12px; text-align:left; font-weight:600;">SKU</th>
                  <th style="padding:12px; text-align:left; font-weight:600;">Nombre</th>
                  <th style="padding:12px; text-align:left; font-weight:600;">Categoría</th>
                  <th style="padding:12px; text-align:right; font-weight:600;">Precio</th>
                  <th style="padding:12px; text-align:center; font-weight:600;">Stock</th>
                  <th style="padding:12px; text-align:center; font-weight:600;">Estado</th>
                  <th style="padding:12px; text-align:center; font-weight:600;">Acciones</th>
                </tr>
              </thead>
              <tbody id="inv-tbody">
                <tr>
                  <td colspan="7" style="padding:20px; text-align:center; color:#6b7280;">
                    Cargando productos...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          
          <!-- Paginación -->
          <div id="pagination" style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; padding:12px; border-top:1px solid #e5e7eb;">
            <div id="page-info" style="color:#6b7280; font-size:0.9rem;">
              Mostrando 0 productos
            </div>
            <div style="display:flex; gap:8px;">
              <button id="prev-page" class="ghost" disabled>← Anterior</button>
              <button id="next-page" class="ghost" disabled>Siguiente →</button>
            </div>
          </div>
        </div>

        <!-- Modal para agregar/editar producto -->
        <div id="modal-product" class="modal">
          <div class="panel" style="max-width:500px;">
            <h3 id="modal-title">➕ Agregar Producto</h3>
            <form id="form-product">
              <input type="hidden" name="id"/>
              
              <div style="display:grid; gap:16px;">
                <div>
                  <label style="display:block; margin-bottom:4px; font-weight:600;">SKU *</label>
                  <input type="text" name="sku" required style="width:100%; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px;"
                         placeholder="Ej: ABR-GRIS-001" pattern="[A-Z0-9\-]+" title="Solo mayúsculas, números y guiones"/>
                </div>
                
                <div>
                  <label style="display:block; margin-bottom:4px; font-weight:600;">Nombre *</label>
                  <input type="text" name="name" required style="width:100%; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px;"
                         placeholder="Nombre del producto"/>
                </div>
                
                <div>
                  <label style="display:block; margin-bottom:4px; font-weight:600;">Categoría *</label>
                  <select name="category" required style="width:100%; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px;">
                    <option value="">Seleccionar categoría</option>
                    <option value="Abrigos">Abrigos</option>
                    <option value="Camisetas">Camisetas</option>
                    <option value="Pantalones">Pantalones</option>
                    <option value="Calzado">Calzado</option>
                    <option value="Accesorios">Accesorios</option>
                    <option value="Blusas">Blusas</option>
                    <option value="Faldas">Faldas</option>
                  </select>
                </div>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                  <div>
                    <label style="display:block; margin-bottom:4px; font-weight:600;">Precio (S/) *</label>
                    <input type="number" name="price" required min="0" step="0.01" 
                           style="width:100%; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px;"
                           placeholder="0.00"/>
                  </div>
                  
                  <div>
                    <label style="display:block; margin-bottom:4px; font-weight:600;">Stock *</label>
                    <input type="number" name="stock" required min="0" step="1"
                           style="width:100%; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px;"
                           placeholder="0"/>
                  </div>
                </div>
                
                <div>
                  <label style="display:block; margin-bottom:4px; font-weight:600;">Alerta de Stock Bajo</label>
                  <input type="number" name="lowStockAlert" min="1" step="1" value="5"
                         style="width:100%; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px;"
                         placeholder="5"/>
                  <div style="font-size:0.8rem; color:#6b7280; margin-top:4px;">
                    Se alertará cuando el stock sea igual o menor a este valor
                  </div>
                </div>
              </div>
              
              <footer style="display:flex; gap:8px; justify-content:flex-end; margin-top:20px;">
                <button type="button" class="ghost" onclick="inventoryManager.closeModal()">Cancelar</button>
                <button type="submit" class="primary">💾 Guardar Producto</button>
              </footer>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="src/js/auth.js"></script>
  <script src="src/js/inventory.js"></script>

</body>
</html>
