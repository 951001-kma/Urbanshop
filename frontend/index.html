<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urbanshop</title>
    <link rel="stylesheet" href="src/css/styles-proyect.css">
</head>

<header class="topbar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
  <h2><!-- se completa por JS --></h2>
  <div id="session-info" class="session-info" style="font-size:14px; color:#374151;"></div>
</header>

<body>
        <div class="login-wrap">
            <h1>🔐Iniciar Sesión</h1>
            
            <form id="loginForm">
                <div class="card">
                <label for="email">Correo eléctronico:</label>
                <input type="email" id="email" name="email" required>
                </div>
                <div class="card">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required minlength="6">
                </div>
                <div class="toolbar" style="display:flex; justify-content:center; margin-top:12px;"></div>
                <button type="submit">Iniciar Sesión</button>
                </form>
                <div id="loginMessage" class="message"></div>
        </div>

    <script src="src/js/auth.js"></script>
</body>
</html>
